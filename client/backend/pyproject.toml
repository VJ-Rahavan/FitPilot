[project]
name = "fitgen-demo-client"
version = "0.1.0"
description = "Demo stand-in for Alexa+: a LangChain agent that talks to the FitGen MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "langchain>=1.4,<2",
    "langchain-aws>=1.8,<2",
    "langchain-groq>=1.1,<2",
    "mcp>=2.3,<3",
    "pydantic-settings>=2.15",
    "uvicorn[standard]>=0.54",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
