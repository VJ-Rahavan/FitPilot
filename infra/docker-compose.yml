services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fitgen
      POSTGRES_PASSWORD: fitgen
      POSTGRES_DB: fitgen
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitgen -d fitgen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
