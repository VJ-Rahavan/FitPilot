[project]
name = "fitgen-alexa"
version = "0.1.0"
description = "FitGen for Alexa+: voice-first AI strength coach MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "boto3>=1.43",
    "fastapi>=0.143.0",
    "groq>=1.7,<2",
    "mcp>=2.3,<3",
    "pydantic-settings>=2.15.0",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

