[project]
name = "fitgen-alexa"
version = "0.1.0"
description = "FitGen for Alexa+: voice-first AI strength coach MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# Imported unchanged from FitGen; imports are rewritten in Phase 3. Remove then.
"server/catalog/*" = ["I001"]
